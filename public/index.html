<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NodeJS Tool - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --sidebar-width: 220px;
            --header-height: 56px;
            --primary: #1a1a1a;
            --primary-hover: #333;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --radius: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 16px;
            gap: 10px;
        }
        .sidebar-header .logo {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }
        .sidebar-nav {
            padding: 12px 10px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.15s;
            margin-bottom: 2px;
            text-decoration: none;
        }
        .nav-item:hover {
            background: var(--bg);
            color: var(--text);
        }
        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 500;
        }
        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Page titles */
        .page-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Hide pages */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">N</div>
                <span>NodeJS Tool</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" data-page="upload" onclick="switchPage('upload')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>分片上传</span>
                </a>
                <a class="nav-item" data-page="files" onclick="switchPage('files')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span>文件管理</span>
                </a>
                <a class="nav-item" data-page="system" onclick="switchPage('system')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>系统设置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div>版本 1.0.0</div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="header">
                <span id="breadcrumb">分片上传</span>
            </div>
            <div class="content">
                <!-- 分片上传页面 -->
                <div id="page-upload" class="page active"></div>

                <!-- 文件管理页面 -->
                <div id="page-files" class="page"></div>

                <!-- 系统设置页面 -->
                <div id="page-system" class="page">
                    <h1 class="page-title">系统设置</h1>
                    <p class="page-desc">系统配置管理（开发中）</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    function switchPage(page) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`[data-page="${page}"]`).classList.add('active');
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById(`page-${page}`).classList.add('active');
        const names = { upload: '分片上传', files: '文件管理', system: '系统设置' };
        document.getElementById('breadcrumb').textContent = names[page] || '';
        if (page === 'files') loadFileList();
    }
    </script>
    <script src="/js/upload.js"></script>
    <script src="/js/files.js"></script>
</body>
</html>
